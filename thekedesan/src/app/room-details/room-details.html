<div class="details-container" *ngIf="room; else notFound">
  <header id="roomCarousel" class="carousel slide" data-bs-ride="carousel">
    <!-- Indicators/Dots -->
    <div class="carousel-indicators" *ngIf="room.images.length > 1">
      <button
        *ngFor="let img of room.images; let i = index"
        type="button"
        data-bs-target="#roomCarousel"
        [attr.data-bs-slide-to]="i"
        [class.active]="i === 0"
        aria-current="true">
      </button>
    </div>

    <div class="carousel-inner">
      <div
        *ngFor="let img of room.images; let i = index"
        class="carousel-item"
        [class.active]="i === 0">
        <div class="room-hero" [style.background-image]="'url(' + img + ')'">
          <div class="hero-overlay d-flex align-items-center">
            <div class="container">
              <h1 class="display-3 room-name">{{ room.name }}</h1>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev" *ngIf="room.images.length > 1">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next" *ngIf="room.images.length > 1">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </header>

  <div class="container py-5">
    <div class="row">
      <div class="col-lg-8">
        <section class="mb-5">
          <h2 class="mb-4">Description</h2>
          <p class="lead text-muted">{{ room.description || 'Experience luxury and comfort in our finely appointed rooms.' }}</p>

          <div class="row g-3 mt-4">
            <div class="col-6 col-md-3">
              <div class="feature-box glass p-3 text-center">
                <i class="bi bi-people fs-2"></i>
                <p class="mb-0">Cap: {{ room.capacity }}</p>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="feature-box glass p-3 text-center">
                <i class="bi bi-door-open fs-2"></i>
                <p class="mb-0">{{ room.bedNum }} Beds</p>
              </div>
            </div>
          </div>
        </section>

       <section class="mb-5" *ngIf="room.amenities.length">
  <h2 class="mb-4">What this room offers</h2>

  <div class="row">
    <!-- This creates a grid where items stack on mobile and spread out on desktop -->
    <div class="col-6 col-md-4 mb-2" *ngFor="let amenity of room.amenities">
      <div class="d-flex align-items-center">
        <i class="bi bi-check-circle-fill me-2 text-success"></i>
        <span>{{ amenity }}</span>
      </div>
    </div>
  </div>
</section>
      </div>

      <div class="col-lg-4">
        <div class="booking-card glass p-4 sticky-top" style="top: 10px;">
          <h3 class="price-text">R {{ room.price }} <small class="text-muted">/ night</small></h3>
          <hr>
          <button class="btn btn-kedesan w-100 btn-lg mb-3">Book This Room</button>
          <p class="text-center small text-muted">No credit card required today</p>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #notFound>
  <div class="container py-5 text-center">
    <h2>Room not found.</h2>
    <a routerLink="/rooms" class="btn btn-primary">Back to Gallery</a>
  </div>
</ng-template>
